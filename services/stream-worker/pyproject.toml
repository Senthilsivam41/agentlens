[project]
name = "agentlens-stream-worker"
version = "0.1.0"
description = "Agent Lens OTLP normalization, trace assembly, and drift scoring worker"
requires-python = ">=3.12,<3.15"
dependencies = [
  "agentlens-contracts",
  "aiokafka>=0.12,<1",
  "clickhouse-connect>=0.8.18,<1",
  "cryptography>=45,<47",
  "cramjam>=2.11,<3",
  "httpx>=0.28,<1",
  "numpy>=2.2,<3",
  "openai>=1.100,<2",
  "opentelemetry-proto>=1.37,<2",
  "pyarrow>=20,<24",
  "pydantic-settings>=2.10,<3",
]

[project.scripts]
agentlens-baseline-import = "agentlens_worker.baseline_import:run"
agentlens-identity-gateway = "agentlens_worker.identity_gateway:run"
agentlens-worker = "agentlens_worker.main:run"

[tool.uv.sources]
agentlens-contracts = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentlens_worker"]
