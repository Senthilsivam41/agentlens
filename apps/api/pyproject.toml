[project]
name = "agentlens-api"
version = "0.1.0"
description = "Agent Lens tenant-scoped investigation API"
requires-python = ">=3.12,<3.15"
dependencies = [
  "agentlens-contracts",
  "clickhouse-connect>=0.8.18,<1",
  "fastapi>=0.116,<1",
  "pydantic-settings>=2.10,<3",
  "pyjwt[crypto]>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
agentlens-api = "agentlens_api.main:run"

[tool.uv.sources]
agentlens-contracts = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentlens_api"]

