name: agentlens

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-agentlens}
      CLICKHOUSE_USER: ${CLICKHOUSE_USERNAME:-agentlens}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_HOST_PORT:-18123}:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user $$CLICKHOUSE_USER --password $$CLICKHOUSE_PASSWORD --query 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrations:
    image: clickhouse/clickhouse-server:26.3
    depends_on:
      clickhouse: {condition: service_healthy}
    environment:
      CLICKHOUSE_USERNAME: ${CLICKHOUSE_USERNAME:-agentlens}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
    volumes:
      - ../../db/migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for migration in /migrations/*.sql; do
          clickhouse-client --host clickhouse --user "$$CLICKHOUSE_USERNAME" \
            --password "$$CLICKHOUSE_PASSWORD" --multiquery < "$${migration}"
        done
    restart: "no"

  redpanda:
    image: redpandadata/redpanda:v25.2.9
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-19092}:19092"
      - "127.0.0.1:${REDPANDA_ADMIN_HOST_PORT:-19644}:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  topics:
    image: redpandadata/redpanda:v25.2.9
    depends_on:
      redpanda: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for topic in agentlens.otlp.traces.v1 agentlens.spans.transient.v1 agentlens.executions.score.v1 agentlens.ingest.dlq.v1; do
          rpk topic describe "$${topic}" --brokers redpanda:9092 >/dev/null 2>&1 ||
            rpk topic create "$${topic}" --brokers redpanda:9092 --topic-config retention.ms=900000 --topic-config cleanup.policy=delete
        done
    restart: "no"

  otel-platform:
    image: otel/opentelemetry-collector-contrib:0.157.0
    command: ["--config=/etc/agentlens/platform.yaml"]
    depends_on:
      topics: {condition: service_completed_successfully}
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_RAW_TOPIC: ${KAFKA_RAW_TOPIC:-agentlens.otlp.traces.v1}
    volumes:
      - ../otel/platform-config.yaml:/etc/agentlens/platform.yaml:ro
    ports:
      - "127.0.0.1:${PLATFORM_OTLP_GRPC_HOST_PORT:-14317}:4317"
      - "127.0.0.1:${PLATFORM_OTLP_HTTP_HOST_PORT:-14318}:4318"
      - "127.0.0.1:${PLATFORM_HEALTH_HOST_PORT:-13134}:13133"
    restart: unless-stopped

  otel-edge:
    image: otel/opentelemetry-collector-contrib:0.157.0
    command: ["--config=/etc/agentlens/edge.yaml"]
    depends_on:
      otel-platform: {condition: service_started}
      edge-queue-init: {condition: service_completed_successfully}
    environment:
      AGENTLENS_TENANT_ID: ${AGENTLENS_TENANT_ID:-local}
      AGENTLENS_CLUSTER_ID: ${AGENTLENS_CLUSTER_ID:-local-compose}
    volumes:
      - ../otel/edge-local-config.yaml:/etc/agentlens/edge.yaml:ro
      - edge-queue:/var/lib/otelcol
    ports:
      - "127.0.0.1:${EDGE_OTLP_GRPC_HOST_PORT:-4317}:4317"
      - "127.0.0.1:${EDGE_OTLP_HTTP_HOST_PORT:-4318}:4318"
      - "127.0.0.1:${EDGE_HEALTH_HOST_PORT:-13133}:13133"
      - "127.0.0.1:${EDGE_METRICS_HOST_PORT:-18889}:8888"
    restart: unless-stopped

  edge-queue-init:
    image: busybox:1.37.0
    user: "0:0"
    command: ["sh", "-ec", "chown -R 10001:10001 /var/lib/otelcol"]
    volumes:
      - edge-queue:/var/lib/otelcol
    restart: "no"

  worker-normalize:
    build:
      context: ../..
      dockerfile: services/stream-worker/Dockerfile
    depends_on:
      topics: {condition: service_completed_successfully}
    environment: &worker-environment
      WORKER_MODE: normalize
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_RAW_TOPIC: ${KAFKA_RAW_TOPIC:-agentlens.otlp.traces.v1}
      KAFKA_SPAN_TOPIC: ${KAFKA_SPAN_TOPIC:-agentlens.spans.transient.v1}
      KAFKA_SCORE_TOPIC: ${KAFKA_SCORE_TOPIC:-agentlens.executions.score.v1}
      KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-agentlens.ingest.dlq.v1}
      AGENTLENS_HMAC_KEY: ${AGENTLENS_HMAC_KEY:?AGENTLENS_HMAC_KEY is required}
      AGENTLENS_TRANSIENT_KEY: ${AGENTLENS_TRANSIENT_KEY:?AGENTLENS_TRANSIENT_KEY is required}
      SEMANTIC_NORMAL_SAMPLE_RATE: ${SEMANTIC_NORMAL_SAMPLE_RATE:-0.1}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-agentlens}
      CLICKHOUSE_USERNAME: ${CLICKHOUSE_USERNAME:-agentlens}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
    restart: unless-stopped

  worker-assemble:
    build:
      context: ../..
      dockerfile: services/stream-worker/Dockerfile
    depends_on:
      migrations: {condition: service_completed_successfully}
      topics: {condition: service_completed_successfully}
    environment:
      <<: *worker-environment
      WORKER_MODE: assemble
    restart: unless-stopped

  worker-score:
    build:
      context: ../..
      dockerfile: services/stream-worker/Dockerfile
    depends_on:
      migrations: {condition: service_completed_successfully}
      topics: {condition: service_completed_successfully}
    environment:
      <<: *worker-environment
      WORKER_MODE: score
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
    restart: unless-stopped

  worker-baseline-import:
    build:
      context: ../..
      dockerfile: services/stream-worker/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrations: {condition: service_completed_successfully}
    environment:
      <<: *worker-environment
      WORKER_MODE: baseline_import
      AGENTLENS_OBJECT_STORE_HTTP_BASE: ${AGENTLENS_OBJECT_STORE_HTTP_BASE:-}
      AGENTLENS_BASELINE_IMPORT_POLL_SECONDS: ${AGENTLENS_BASELINE_IMPORT_POLL_SECONDS:-15}
      AGENTLENS_BASELINE_IMPORT_MIN_RECORDS: ${AGENTLENS_BASELINE_IMPORT_MIN_RECORDS:-500}
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    depends_on:
      migrations: {condition: service_completed_successfully}
    environment:
      AGENTLENS_ENVIRONMENT: ${AGENTLENS_ENVIRONMENT:-development}
      AGENTLENS_AUTH_MODE: ${AGENTLENS_AUTH_MODE:-dev}
      AGENTLENS_DEV_TENANT_ID: ${AGENTLENS_DEV_TENANT_ID:-local}
      AGENTLENS_DEV_ROLES: ${AGENTLENS_DEV_ROLES:-viewer,analyst,admin}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-agentlens}
      CLICKHOUSE_USERNAME: ${CLICKHOUSE_USERNAME:-agentlens}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-agentlens-api}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-18000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    depends_on:
      api: {condition: service_healthy}
    environment:
      AGENTLENS_API_URL: http://api:8000
      NEXT_PUBLIC_AGENTLENS_API_URL: ${NEXT_PUBLIC_AGENTLENS_API_URL:-http://localhost:18000}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost:3000/api/auth/callback}
      OIDC_AUTHORIZATION_ENDPOINT: ${OIDC_AUTHORIZATION_ENDPOINT:-}
      OIDC_TOKEN_ENDPOINT: ${OIDC_TOKEN_ENDPOINT:-}
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-agentlens}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-agentlens-development-only}
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-19001}:9001"
      - "127.0.0.1:${MINIO_API_HOST_PORT:-19002}:9000"
    volumes:
      - minio-data:/data
    restart: unless-stopped

volumes:
  clickhouse-data:
  redpanda-data:
  edge-queue:
  minio-data:
