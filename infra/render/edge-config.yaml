# OpenTelemetry Collector config for the Render "edge" collector (public ingest
# web service). Agents send OTLP here; it redacts sensitive content, stamps
# tenant/cluster identity, and forwards to the private platform collector.
#
# Render specifics vs infra/otel/edge-local-config.yaml:
#   * The public OTLP/HTTP receiver binds ${PORT} (Render's assigned web port,
#     default 10000) so external agents can reach it over HTTPS.
#   * The platform collector's dynamic internal hostname is injected via
#     PLATFORM_HOST (Blueprint fromService reference).
#   * The on-disk sending queue is replaced with an in-memory queue so no
#     persistent disk is required for the edge.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:${env:PORT:-10000}

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 96
  redaction:
    allow_all_keys: true
    blocked_values:
      - '(?i)(api[_-]?key|authorization|password|secret|token)["'' ]*[:=]["'' ]*[^,; ]+'
      - '(?i)bearer\s+[a-z0-9._~+/-]+=*'
      - '\b(?:\d[ -]*?){13,19}\b'
    summary: info
  resource/agentlens:
    attributes:
      - {key: agentlens.tenant_id, value: "${env:AGENTLENS_TENANT_ID}", action: upsert}
      - {key: agentlens.cluster_id, value: "${env:AGENTLENS_CLUSTER_ID}", action: upsert}
      - {key: cloud.provider, value: render, action: upsert}
  transform/agentlens_mapping:
    error_mode: ignore
    trace_statements:
      - context: resource
        statements:
          - set(attributes["agentlens.agent.name"], attributes["service.name"]) where attributes["agentlens.agent.name"] == nil and attributes["service.name"] != nil
          - set(attributes["agentlens.agent.name"], attributes["gen_ai.agent.name"]) where attributes["agentlens.agent.name"] == nil and attributes["gen_ai.agent.name"] != nil
          - set(attributes["agentlens.agent.id"], attributes["agentlens.agent.name"]) where attributes["agentlens.agent.id"] == nil and attributes["agentlens.agent.name"] != nil
          - set(attributes["agentlens.agent.id"], attributes["gen_ai.agent.id"]) where attributes["agentlens.agent.id"] == nil and attributes["gen_ai.agent.id"] != nil
          - set(attributes["agentlens.agent.id"], attributes["service.name"]) where attributes["agentlens.agent.id"] == nil and attributes["service.name"] != nil
          - set(attributes["agentlens.agent.version"], attributes["service.version"]) where attributes["agentlens.agent.version"] == nil and attributes["service.version"] != nil
          - set(attributes["agentlens.agent.version"], "unknown") where attributes["agentlens.agent.version"] == nil
          - set(attributes["agentlens.framework"], "generic") where attributes["agentlens.framework"] == nil
      - context: span
        statements:
          - set(attributes["agentlens.run.id"], attributes["gen_ai.response.id"]) where attributes["agentlens.run.id"] == nil and attributes["gen_ai.response.id"] != nil
          - set(attributes["agentlens.run.id"], attributes["session.id"]) where attributes["agentlens.run.id"] == nil and attributes["session.id"] != nil
          - set(attributes["agentlens.run.id"], attributes["gcp.vertex.agent.session_id"]) where attributes["agentlens.run.id"] == nil and attributes["gcp.vertex.agent.session_id"] != nil
          - set(attributes["tool.name"], attributes["gen_ai.tool.name"]) where attributes["tool.name"] == nil and attributes["gen_ai.tool.name"] != nil
          - set(attributes["tool.name"], attributes["openinference.tool.name"]) where attributes["tool.name"] == nil and attributes["openinference.tool.name"] != nil
          - set(attributes["openinference.tool.name"], attributes["tool.name"]) where attributes["openinference.tool.name"] == nil and attributes["tool.name"] != nil
          - set(attributes["agentlens.tool.call_id"], attributes["gen_ai.tool.call.id"]) where attributes["agentlens.tool.call_id"] == nil and attributes["gen_ai.tool.call.id"] != nil
          - set(attributes["agentlens.tool.call_id"], attributes["tool.call.id"]) where attributes["agentlens.tool.call_id"] == nil and attributes["tool.call.id"] != nil
  batch: {timeout: 1s, send_batch_size: 1024}

exporters:
  otlp_grpc/platform:
    endpoint: "${env:PLATFORM_HOST}:4317"
    tls: {insecure: true}
    sending_queue: {enabled: true, queue_size: 10000}
    retry_on_failure: {enabled: true, initial_interval: 1s, max_interval: 30s, max_elapsed_time: 0s}

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, redaction, resource/agentlens, transform/agentlens_mapping, batch]
      exporters: [otlp_grpc/platform]
  telemetry:
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
