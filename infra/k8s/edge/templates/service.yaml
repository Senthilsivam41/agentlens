apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentlens-edge.fullname" . }}
  annotations:
{{ toYaml .Values.service.annotations | indent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "agentlens-edge.name" . }}
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}

