apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "agentlens-edge.fullname" . }}
spec:
  serviceName: {{ include "agentlens-edge.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: Parallel
  updateStrategy: {type: RollingUpdate}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "agentlens-edge.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "agentlens-edge.name" . }}
      annotations:
{{ toYaml .Values.podAnnotations | indent 8 }}
    spec:
      serviceAccountName: {{ include "agentlens-edge.fullname" . }}
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: collector
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config=/etc/agentlens/collector.yaml"]
          env:
            - name: AGENTLENS_TENANT_ID
              value: {{ required "tenantId is required" .Values.tenantId | quote }}
            - name: AGENTLENS_CLUSTER_ID
              value: {{ required "clusterId is required" .Values.clusterId | quote }}
            - name: AGENTLENS_PLATFORM_OTLP_ENDPOINT
              value: {{ required "platformEndpoint is required" .Values.platformEndpoint | quote }}
            - name: AGENTLENS_PLATFORM_TLS_INSECURE
              value: {{ .Values.platformTlsInsecure | quote }}
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
            - {name: health, containerPort: 13133}
            - {name: metrics, containerPort: 8888}
          readinessProbe:
            httpGet: {path: /, port: health}
          livenessProbe:
            httpGet: {path: /, port: health}
          resources:
{{ toYaml .Values.resources | indent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/agentlens/collector.yaml, subPath: collector.yaml, readOnly: true}
            - {name: tls, mountPath: /etc/agentlens/tls, readOnly: true}
            - {name: queue, mountPath: /var/lib/otelcol}
      volumes:
        - name: config
          configMap: {name: {{ include "agentlens-edge.fullname" . }}}
        - name: tls
          secret: {secretName: {{ .Values.existingTlsSecret }}}
{{- if not .Values.persistence.enabled }}
        - name: queue
          emptyDir: {sizeLimit: {{ .Values.persistence.size }}}
{{- end }}
{{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: queue
      spec:
        accessModes: ["ReadWriteOnce"]
{{- if .Values.persistence.storageClassName }}
        storageClassName: {{ .Values.persistence.storageClassName | quote }}
{{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
{{- end }}
