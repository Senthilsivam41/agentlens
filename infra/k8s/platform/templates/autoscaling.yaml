{{- if .Values.autoscaling.enabled }}
{{- range $component := list "api" "web" "worker-normalize" "worker-assemble" "worker-score" "collector" }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "agentlens-platform.fullname" $ }}-{{ $component }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "agentlens-platform.fullname" $ }}-{{ $component }}
  minReplicas: {{ $.Values.autoscaling.minReplicas }}
  maxReplicas: {{ $.Values.autoscaling.maxReplicas }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $.Values.autoscaling.targetCpuUtilization }}
---
{{- end }}
{{- end }}
