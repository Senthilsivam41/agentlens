apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentlens-platform.fullname" . }}-api
spec:
  selector: {app.kubernetes.io/component: api}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentlens-platform.fullname" . }}-web
spec:
  selector: {app.kubernetes.io/component: web}
  ports: [{name: http, port: 3000, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentlens-platform.fullname" . }}-collector
spec:
  selector: {app.kubernetes.io/component: collector}
  ports:
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
