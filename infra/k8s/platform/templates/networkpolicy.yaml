apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentlens-platform.fullname" . }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.ingress.controllerNamespace }}
      ports:
        - {protocol: TCP, port: 3000}
        - {protocol: TCP, port: 8000}
        - {protocol: TCP, port: 4317}
        - {protocol: TCP, port: 4318}
  egress:
    - {}
