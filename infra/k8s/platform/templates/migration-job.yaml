apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "agentlens-platform.fullname" . }}-migrate-{{ .Release.Revision }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "-5"
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: {app.kubernetes.io/component: migration}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: {{ .Values.migrations.image | quote }}
          envFrom:
            - configMapRef: {name: {{ include "agentlens-platform.fullname" . }}}
            - secretRef: {name: {{ .Values.existingSecret }}}
          env:
            - {name: CLICKHOUSE_NATIVE_PORT, value: {{ .Values.config.clickhouseNativePort | quote }}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true}
