[project]
name = "agentlens"
version = "0.1.0"
description = "Optional Agent Lens instrumentation helpers"
requires-python = ">=3.12,<3.15"
dependencies = [
  "opentelemetry-api>=1.37,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.37,<2",
  "opentelemetry-sdk>=1.37,<2",
]

[project.optional-dependencies]
langgraph = ["openinference-instrumentation-langchain>=0.1.54,<1"]
langchain = ["openinference-instrumentation-langchain>=0.1.54,<1"]
crewai = ["openinference-instrumentation-crewai>=0.1.13,<1"]
adk = ["google-adk>=1.17,<3"]
mapping = ["pyyaml>=6,<7"]
all = [
  "openinference-instrumentation-langchain>=0.1.54,<1",
  "openinference-instrumentation-crewai>=0.1.13,<1",
  "google-adk>=1.17,<3",
  "pyyaml>=6,<7",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentlens"]

