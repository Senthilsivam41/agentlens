[project]
name = "agentlens-contracts"
version = "0.1.0"
description = "Versioned Agent Lens domain and event contracts"
requires-python = ">=3.12,<3.15"
dependencies = ["pydantic>=2.11,<3"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentlens_contracts"]

